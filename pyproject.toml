[project]
name = "chargeback"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "anthropic[bedrock]",
    "asyncpg",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff"
]

[tool.pytest.ini_options]
pythonpath = ["."]
