services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chargeback
      POSTGRES_PASSWORD: chargeback_dev
      POSTGRES_DB: chargeback
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: